        padding: 12px clamp(16px, 4vw, 32px);

        display: block;

        display: block;

        height: auto;
      }

        align-items: center;
        color: var(--cool-grey);
        font-size: 0.9rem;
      }

      .language-menu select {
        border: 1px solid var(--light-grey);
        background: var(--white);
        color: var(--deep-navy);
        border-radius: 6px;
        padding: 6px 10px;
        font: inherit;
        font-size: 0.875rem;
      }

      .language-menu select:focus-visible {
        outline: 2px solid var(--kodevelop-navy);
        outline-offset: 2px;
      }

      .profile-header {
        text-align: center;
        padding: 32px 0 24px;
      }

      .profile-header img {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        object-fit: cover;
      }

      .profile-header h1 {
        margin: 16px 0 8px;
        color: var(--kodevelop-navy);
        font-size: clamp(2.5rem, 5vw, 3.5rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.2;
      }

      .profile-header p {
        max-width: 680px;
        margin: 0 auto;
        color: var(--cool-grey);
        font-size: 1.0625rem;
        font-weight: 300;
      }

      .section {
        margin-top: 24px;
        padding: clamp(20px, 3vw, 32px);
        background-color: var(--white);
        border: 1px solid var(--light-grey);
        border-radius: 8px;
      }

      .section h2 {
        margin: 0 0 12px;
        color: var(--kodevelop-navy);
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        font-weight: 600;
        line-height: 1.25;
      }

      .section p {
        margin: 10px 0;
        color: var(--cool-grey);
      }

      .section a {
        text-decoration: none;
      }

      .section a:hover {
        text-decoration: underline;
      }

      .social-logo {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        vertical-align: middle;
        margin: 4px 8px 0 0;
      }

      .work-experience {
        list-style: none;
        padding: 0;
      }

      .work-experience li {
        margin-bottom: 12px;
        padding-left: 16px;
        position: relative;
        color: var(--cool-grey);
      }

      .work-experience li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 4px;
        bottom: 4px;
        width: 3px;
        background-color: var(--kodevelop-navy);
        border-radius: 2px;
      }

      .project-list {
        list-style: none;
        padding: 0;
        margin: 18px 0 0;
      }

      .project-list li {
        background: var(--off-white);
        border-left: 3px solid var(--kodevelop-navy);
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 12px;
        color: var(--cool-grey);
      }

      .project-list strong {
        color: var(--deep-navy);
      }

      .project-list a.project-link,
      .project-list a.company-link {
        color: var(--kodevelop-navy);
        text-decoration: none;
        font-weight: 600;
      }

      .project-list a.project-link:hover,
      .project-list a.company-link:hover {
        text-decoration: underline;
      }

      .site-footer {
        display: flex;
        justify-content: center;
        padding: 20px 16px;
        background-color: var(--deep-navy);
      }

        display: block;
        width: min(210px, 65vw);
        height: auto;

          border: 0;

          width: min(220px, 48vw);

      const elements = {
        name: document.getElementById('profile-name'),
        headline: document.getElementById('profile-headline'),
        profileTitle: document.getElementById('profile-title'),
        profileText: document.getElementById('profile-text'),
        expertiseTitle: document.getElementById('expertise-title'),
        expertiseIntro: document.getElementById('expertise-intro'),
        expertiseList: document.getElementById('expertise-list'),
        projectsTitle: document.getElementById('projects-title'),
        projectsIntro: document.getElementById('projects-intro'),
        projectsList: document.getElementById('projects-list'),
        contactTitle: document.getElementById('contact-title'),
        roleLabel: document.getElementById('role-label'),
        roleValue: document.getElementById('role-value'),
        educationLabel: document.getElementById('education-label'),
        educationValue: document.getElementById('education-value'),
        locationLabel: document.getElementById('location-label'),
        locationValue: document.getElementById('location-value'),
        contactMessage: document.getElementById('contact-message')
      };

      const languageSelect = document.getElementById('language-select');

      function createLink(text, url, className) {
        const link = document.createElement('a');
        link.className = className;
        link.href = url;
        link.target = '_blank';
        link.rel = 'noreferrer';
        link.textContent = text;
        return link;
      }

      function renderExpertise(items, labelSuffix) {
        elements.expertiseList.replaceChildren(...items.map((item) => {
          const listItem = document.createElement('li');
          const label = document.createElement('strong');
          label.textContent = item.label + labelSuffix;
          listItem.append(label, document.createTextNode(' ' + item.description));
          return listItem;
        }));
      }

      function renderProjects(projects, companyPrefix) {
        elements.projectsList.replaceChildren(...projects.map((project) => {
          const listItem = document.createElement('li');
          listItem.append(
            createLink(project.title, project.url, 'project-link'),
            document.createTextNode(' — ' + project.description + ' ' + companyPrefix + ' '),
            createLink(project.company, project.companyUrl, 'company-link'),
            document.createTextNode('.')
          );
          return listItem;
        }));
      }

      function render(lang) {
        const content = translations[lang];
        if (!content) return;

        document.documentElement.lang = lang;
        document.title = content.name + ' | ' + content.headline.split('·')[0].trim();

        elements.name.textContent = content.name;
        elements.headline.textContent = content.headline;
        elements.profileTitle.textContent = content.profileTitle;
        elements.profileText.textContent = content.profileText;
        elements.expertiseTitle.textContent = content.expertiseTitle;
        elements.expertiseIntro.textContent = content.expertiseIntro;
        renderExpertise(content.expertise, content.expertiseLabelSuffix);
        elements.projectsTitle.textContent = content.projectsTitle;
        elements.projectsIntro.textContent = content.projectsIntro;
        renderProjects(content.projects, content.projectCompanyPrefix);
        elements.contactTitle.textContent = content.contactTitle;
        elements.roleLabel.textContent = content.roleLabel;
        elements.roleValue.textContent = content.roleValue;
        elements.educationLabel.textContent = content.educationLabel;
        elements.educationValue.textContent = content.educationValue;
        elements.locationLabel.textContent = content.locationLabel;
        elements.locationValue.textContent = content.locationValue;
        elements.contactMessage.textContent = content.contactMessage;
        languageSelect.value = lang;
      }

      function detectBrowserLanguage() {
        const browserLanguage =
          (navigator.languages && navigator.languages[0]) ||
          navigator.language ||
          navigator.userLanguage ||
          'en';

        const normalized = browserLanguage.toLowerCase();
        return Object.keys(translations).find((lang) => normalized.startsWith(lang)) || 'en';
      }

      const savedLanguage = localStorage.getItem('kde-language');
      const initialLanguage = translations[savedLanguage] ? savedLanguage : detectBrowserLanguage();
      render(initialLanguage);

      languageSelect.addEventListener('change', (event) => {
        const selectedLanguage = event.target.value;
        localStorage.setItem('kde-language', selectedLanguage);
        render(selectedLanguage);
      });
    </script>
  </body>
</html>
