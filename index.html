<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kodevelop | Software &amp; Architecture</title>
    <link rel="icon" type="image/png" href="./static/kodevelop-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --kodevelop-navy: #073b82;
        --deep-navy: #082e67;
        --blue: #2865b8;
        --pale-blue: #edf4fb;
        --cool-grey: #6487bd;
        --light-blue: #d8e7f7;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--deep-navy);
        background: var(--white);
        font-family: "Poppins", sans-serif;
        line-height: 1.6;
      }

      a {
        color: inherit;
      }

      a:focus-visible,
      select:focus-visible {
        outline: 3px solid #75a8e5;
        outline-offset: 4px;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 30px;
        max-width: 1240px;
        min-height: 94px;
        margin: 0 auto;
        padding: 16px 30px;
        border-bottom: 1px solid #eef2f7;
      }

      .brand,
      .brand img {
        display: block;
      }

      .brand img {
        width: min(250px, 26vw);
        height: auto;
      }

      .main-nav {
        display: flex;
        align-items: center;
        gap: clamp(18px, 3.5vw, 42px);
        margin-left: auto;
      }

      .main-nav a {
        color: var(--deep-navy);
        font-size: 0.9rem;
        text-decoration: none;
      }

      .main-nav a:hover,
      .text-link:hover {
        color: var(--blue);
        text-decoration: underline;
        text-underline-offset: 5px;
      }

      .language-menu select {
        max-width: 122px;
        padding: 7px 8px;
        border: 1px solid var(--light-blue);
        border-radius: 6px;
        background: var(--white);
        color: var(--deep-navy);
        font: inherit;
        font-size: 0.8rem;
      }

      .button {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 10px 26px;
        border: 1.5px solid var(--kodevelop-navy);
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 160ms ease, color 160ms ease, transform 160ms ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button-primary {
        background: var(--kodevelop-navy);
        color: var(--white);
      }

      .button-primary:hover {
        background: var(--deep-navy);
      }

      .button-outline {
        background: transparent;
        color: var(--kodevelop-navy);
      }

      .button-outline:hover {
        background: var(--pale-blue);
      }

      .header-cta {
        min-height: 42px;
        padding: 8px 25px;
        font-size: 0.82rem;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(340px, 0.85fr);
        align-items: center;
        gap: 35px;
        max-width: 1240px;
        min-height: 415px;
        margin: 0 auto;
        padding: 55px 30px 62px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #5889ce;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.23em;
      }

      .hero h1 {
        max-width: 670px;
        margin: 0;
        color: var(--kodevelop-navy);
        font-size: clamp(2.5rem, 4.7vw, 4rem);
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1.15;
      }

      .hero-copy {
        max-width: 595px;
        margin: 20px 0 25px;
        color: var(--cool-grey);
        font-size: clamp(1rem, 1.5vw, 1.15rem);
        line-height: 1.65;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }

      .hero-illustration {
        display: block;
        width: 100%;
        max-width: 470px;
        margin: 0 auto;
      }

      .services-band {
        background: linear-gradient(110deg, #f2f7fc, #f8fbfe);
      }

      .services-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(28px, 7vw, 88px);
        max-width: 1180px;
        margin: 0 auto;
        padding: 48px 30px 54px;
      }

      .service-card {
        min-width: 0;
      }

      .service-icon {
        display: block;
        width: 56px;
        height: 56px;
        margin-bottom: 13px;
        fill: none;
        stroke: var(--kodevelop-navy);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .service-card h2 {
        margin: 0 0 12px;
        color: var(--kodevelop-navy);
        font-size: clamp(1.15rem, 1.8vw, 1.4rem);
        line-height: 1.35;
      }

      .service-card p {
        margin: 0;
        color: var(--cool-grey);
        font-size: 0.96rem;
      }

      .projects-section {
        padding: 54px 30px 62px;
        background: var(--white);
      }

      .projects-heading {
        max-width: 760px;
        margin: 0 auto 28px;
        text-align: center;
      }

      .projects-heading h2 {
        margin: 0 0 8px;
        color: var(--kodevelop-navy);
        font-size: clamp(1.8rem, 3.2vw, 2.45rem);
        letter-spacing: -0.035em;
        line-height: 1.2;
      }

      .projects-heading p {
        margin: 0;
        color: var(--cool-grey);
      }

      .project-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        max-width: 1050px;
        margin: 0 auto;
      }

      .project-card {
        padding: 22px 24px;
        border: 1px solid var(--light-blue);
        border-radius: 10px;
        background: #fbfdff;
        transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }

      .project-card:hover {
        transform: translateY(-2px);
        border-color: #a9c7e9;
        box-shadow: 0 10px 25px rgb(8 46 103 / 8%);
      }

      .project-card h3 {
        margin: 0 0 8px;
        font-size: 1.15rem;
        line-height: 1.35;
      }

      .project-card h3 a {
        color: var(--kodevelop-navy);
        text-decoration: none;
      }

      .project-card h3 a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .project-card p {
        margin: 0;
        color: var(--cool-grey);
        font-size: 0.92rem;
      }

      .project-card .project-company {
        margin-top: 12px;
        color: var(--deep-navy);
        font-size: 0.82rem;
      }

      .project-company a {
        color: var(--kodevelop-navy);
        font-weight: 600;
        text-decoration: none;
      }

      .project-company a:hover {
        text-decoration: underline;
      }

      .about-section {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        align-items: center;
        gap: 42px;
        max-width: 900px;
        margin: 0 auto;
        padding: 60px 30px 38px;
      }

      .portrait {
        display: block;
        width: 172px;
        height: 172px;
        border-radius: 36% 36% 42% 42%;
        object-fit: cover;
      }

      .about-section .eyebrow {
        margin-bottom: 4px;
      }

      .about-section h2 {
        max-width: 620px;
        margin: 0 0 14px;
        color: var(--kodevelop-navy);
        font-size: clamp(1.8rem, 3.2vw, 2.55rem);
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.2;
      }

      .about-section p:not(.eyebrow) {
        max-width: 620px;
        margin: 0 0 18px;
        color: var(--cool-grey);
      }

      .text-link {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--kodevelop-navy);
        color: var(--kodevelop-navy);
        font-size: 0.95rem;
        font-weight: 500;
        text-decoration: none;
      }

      .technology-strip {
        max-width: 1180px;
        margin: 0 auto;
        padding: 20px 30px 48px;
      }

      .technology-strip .eyebrow {
        margin-bottom: 16px;
      }

      .technology-list {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 0;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .technology-list li {
        padding: 0 10px;
        border-right: 1px solid var(--light-blue);
        color: var(--deep-navy);
        font-size: 1rem;
        text-align: center;
      }

      .technology-list li:first-child {
        padding-left: 0;
      }

      .technology-list li:last-child {
        padding-right: 0;
        border-right: 0;
      }

      .contact-banner {
        position: relative;
        overflow: hidden;
        padding: 42px 24px 39px;
        background: radial-gradient(ellipse at 50% 0, #124986, var(--deep-navy) 72%);
        color: var(--white);
        text-align: center;
      }

      .contact-banner::before,
      .contact-banner::after {
        position: absolute;
        width: 230px;
        height: 230px;
        border: 1px solid rgb(131 178 230 / 24%);
        border-radius: 50%;
        content: "";
        pointer-events: none;
      }

      .contact-banner::before {
        bottom: -175px;
        left: -40px;
      }

      .contact-banner::after {
        top: -175px;
        right: -115px;
      }

      .contact-banner h2 {
        position: relative;
        margin: 0 0 16px;
        font-size: clamp(1.6rem, 3vw, 2.15rem);
        line-height: 1.3;
      }

      .contact-banner .button {
        position: relative;
        border-color: var(--white);
        color: var(--white);
      }

      .contact-banner .button:hover {
        background: var(--white);
        color: var(--deep-navy);
      }

      .site-footer {
        max-width: 1180px;
        margin: 0 auto;
        padding: 20px 30px 14px;
      }

      .footer-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-bottom: 16px;
      }

      .footer-brand img {
        display: block;
        width: min(220px, 52vw);
        height: auto;
      }

      .footer-email {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--kodevelop-navy);
        font-size: 0.86rem;
        text-decoration: none;
      }

      .footer-email:hover {
        text-decoration: underline;
      }

      .copyright {
        margin: 0;
        padding-top: 11px;
        border-top: 1px solid var(--light-blue);
        color: var(--cool-grey);
        font-size: 0.78rem;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      @media (max-width: 900px) {
        .site-header {
          flex-wrap: wrap;
          gap: 18px 24px;
        }

        .main-nav {
          gap: 20px;
        }

        .hero {
          grid-template-columns: minmax(0, 1fr) minmax(275px, 0.8fr);
          gap: 18px;
          min-height: 365px;
          padding-top: 45px;
        }

        .hero h1 {
          font-size: clamp(2.25rem, 5vw, 3.3rem);
        }
      }

      @media (max-width: 680px) {
        .site-header {
          justify-content: space-between;
          gap: 14px;
          padding: 14px 20px;
        }

        .brand img {
          width: min(220px, 52vw);
        }

        .main-nav {
          order: 3;
          justify-content: space-between;
          width: 100%;
          gap: 10px;
        }

        .main-nav a {
          font-size: 0.82rem;
        }

        .header-cta {
          display: none;
        }

        .hero {
          grid-template-columns: 1fr;
          gap: 10px;
          padding: 45px 22px 48px;
        }

        .hero-illustration {
          width: min(82%, 370px);
          margin-top: 12px;
        }

        .hero h1 {
          max-width: 560px;
          font-size: clamp(2.4rem, 10vw, 3.4rem);
        }

        .services-grid {
          grid-template-columns: 1fr;
          gap: 30px;
          padding: 38px 24px;
        }

        .service-card {
          display: grid;
          grid-template-columns: 56px minmax(0, 1fr);
          column-gap: 16px;
        }

        .service-icon {
          grid-row: span 2;
          margin: 0;
        }

        .service-card h2 {
          margin-bottom: 6px;
        }

        .projects-section {
          padding: 42px 22px;
        }

        .project-grid {
          grid-template-columns: 1fr;
          gap: 14px;
        }

        .about-section {
          grid-template-columns: 115px minmax(0, 1fr);
          gap: 24px;
          padding: 42px 24px 30px;
        }

        .portrait {
          width: 115px;
          height: 145px;
        }

        .technology-strip {
          padding: 15px 24px 38px;
        }

        .technology-list {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          row-gap: 16px;
        }

        .technology-list li:nth-child(3n) {
          border-right: 0;
        }

        .technology-list li:nth-child(4) {
          padding-left: 0;
        }
      }

      @media (max-width: 440px) {
        .language-menu select {
          max-width: 96px;
          padding: 6px;
          font-size: 0.72rem;
        }

        .hero-actions {
          align-items: stretch;
          flex-direction: column;
        }

        .hero-actions .button {
          width: 100%;
        }

        .about-section {
          grid-template-columns: 1fr;
          gap: 22px;
        }

        .portrait {
          width: 130px;
          height: 150px;
        }

        .footer-main {
          align-items: flex-start;
          flex-direction: column;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Kodevelop home">
        <img src="./static/kodevelop-logo-horizontal.png" alt="Kodevelop — software &amp; architecture" />
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a id="nav-services" href="#services"></a>
        <a id="nav-projects" href="#projects"></a>
        <a id="nav-technology" href="#technologies"></a>
        <a id="nav-about" href="#about"></a>
        <a id="nav-contact" href="#contact"></a>
      </nav>
      <div class="language-menu">
        <label class="visually-hidden" for="language-select">Language</label>
        <select id="language-select" aria-label="Select language">
          <option value="en">English</option>
          <option value="nl">Nederlands</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
      <a class="button button-primary header-cta" id="header-contact" href="mailto:info@kodevelop.be"></a>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-content">
          <p class="eyebrow" id="hero-eyebrow"></p>
          <h1 id="hero-title"></h1>
          <p class="hero-copy" id="hero-text"></p>
          <div class="hero-actions">
            <a class="button button-primary" id="hero-primary-cta" href="mailto:info@kodevelop.be">
              <span></span><span aria-hidden="true">→</span>
            </a>
            <a class="button button-outline" id="hero-secondary-cta" href="#services"></a>
          </div>
        </div>
        <svg class="hero-illustration" viewBox="0 0 480 340" aria-hidden="true">
          <circle cx="220" cy="170" r="145" fill="#eef5fc" />
          <circle cx="115" cy="213" r="84" fill="#e5f0fb" />
          <circle cx="354" cy="210" r="88" fill="#f4f8fc" />
          <path d="M345 80h72a8 8 0 0 1 8 8v95m0 0h37m-37 0v30h-41m-74 45v35h156v-23" fill="none" stroke="#0a3b7a" stroke-width="2" />
          <circle cx="345" cy="80" r="5" fill="#0a3b7a" />
          <circle cx="425" cy="183" r="5" fill="#0a3b7a" />
          <circle cx="310" cy="268" r="5" fill="#0a3b7a" />
          <rect x="86" y="92" width="270" height="184" rx="14" fill="#fff" stroke="#0a3b7a" stroke-width="3" />
          <path d="M100 92h242a14 14 0 0 1 14 14v12H86v-12a14 14 0 0 1 14-14Z" fill="#0a3b7a" />
          <circle cx="105" cy="105" r="4" fill="#fff" />
          <circle cx="120" cy="105" r="4" fill="#fff" />
          <circle cx="135" cy="105" r="4" fill="#fff" />
          <path d="M120 148h42m-42 18h84m-84 18h111m-111 18h51m-51 18h95" stroke="#0a3b7a" stroke-linecap="round" stroke-width="6" />
          <path d="M176 148h53m-15 18h74m-46 18h52m-66 18h71m-42 18h38" stroke="#b7cee9" stroke-linecap="round" stroke-width="6" />
          <path d="m423 46 28 16v33l-28 16-28-16V62l28-16Zm-28 16 28 17 28-17m-28 17v32" fill="none" stroke="#0a3b7a" stroke-linejoin="round" stroke-width="2.5" />
          <ellipse cx="423" cy="245" rx="27" ry="11" fill="#fff" stroke="#0a3b7a" stroke-width="2.5" />
          <path d="M396 245v43c0 6 12 11 27 11s27-5 27-11v-43m-54 15c0 6 12 11 27 11s27-5 27-11m-54 14c0 6 12 11 27 11s27-5 27-11" fill="none" stroke="#0a3b7a" stroke-width="2.5" />
        </svg>
      </section>

      <section class="services-band" id="services" aria-labelledby="services-title">
        <h2 class="visually-hidden" id="services-title"></h2>
        <div class="services-grid">
          <article class="service-card">
            <svg class="service-icon" viewBox="0 0 56 56" aria-hidden="true">
              <path d="m17 17-12 11 12 11m22-22 12 11-12 11M33 8 23 48" />
            </svg>
            <h2 id="service-title-1"></h2>
            <p id="service-description-1"></p>
          </article>
          <article class="service-card">
            <svg class="service-icon" viewBox="0 0 56 56" aria-hidden="true">
              <rect x="22" y="5" width="12" height="12" rx="1" />
              <rect x="5" y="39" width="12" height="12" rx="1" />
              <rect x="39" y="39" width="12" height="12" rx="1" />
              <path d="M28 17v10M11 39V27h34v12M45 27v12" />
            </svg>
            <h2 id="service-title-2"></h2>
            <p id="service-description-2"></p>
          </article>
          <article class="service-card">
            <svg class="service-icon" viewBox="0 0 56 56" aria-hidden="true">
              <path d="M17 43h24a11 11 0 0 0 1-22 15 15 0 0 0-28-2 12 12 0 0 0 3 24Z" />
            </svg>
            <h2 id="service-title-3"></h2>
            <p id="service-description-3"></p>
          </article>
        </div>
      </section>

      <section class="projects-section" id="projects" aria-labelledby="projects-title">
        <div class="projects-heading">
          <h2 id="projects-title"></h2>
          <p id="projects-intro"></p>
        </div>
        <div class="project-grid" id="project-list"></div>
      </section>

      <section class="about-section" id="about" aria-labelledby="about-title">
        <img class="portrait" src="./static/headshot.png" alt="Portrait of Jens Malfait" />
        <div>
          <p class="eyebrow" id="about-eyebrow"></p>
          <h2 id="about-title"></h2>
          <p id="about-text"></p>
          <a class="text-link" href="https://www.linkedin.com/in/jens-malfait-55916a64" target="_blank" rel="noreferrer">
            <span id="about-link"></span><span aria-hidden="true">→</span>
          </a>
        </div>
      </section>

      <section class="technology-strip" id="technologies" aria-labelledby="technologies-title">
        <h2 class="eyebrow" id="technologies-title"></h2>
        <ul class="technology-list" id="technology-list"></ul>
      </section>

      <section class="contact-banner" id="contact" aria-labelledby="contact-cta-title">
        <h2 id="contact-cta-title"></h2>
        <a class="button" id="contact-cta-link" href="mailto:info@kodevelop.be">
          <span></span><span aria-hidden="true">→</span>
        </a>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-main">
        <a class="footer-brand" href="./index.html" aria-label="Kodevelop home">
          <img src="./static/kodevelop-logo-horizontal.png" alt="Kodevelop — software &amp; architecture" />
        </a>
        <a class="footer-email" href="mailto:info@kodevelop.be">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="1" stroke="currentColor" stroke-width="1.8" />
            <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.8" />
          </svg>
          info@kodevelop.be
        </a>
      </div>
      <p class="copyright" id="copyright-text"></p>

      const languageSelect = document.getElementById('language-select');

      function renderProjects(projects, companyPrefix) {
        elements.projectList.replaceChildren(...projects.map((project) => {
          const card = document.createElement('article');
          card.className = 'project-card';

          const title = document.createElement('h3');
          const projectLink = document.createElement('a');
          projectLink.href = project.url;
          projectLink.target = '_blank';
          projectLink.rel = 'noreferrer';
          projectLink.textContent = project.title;
          title.append(projectLink);

          const description = document.createElement('p');
          description.textContent = project.description;

          const company = document.createElement('p');
          company.className = 'project-company';
          company.append(document.createTextNode(companyPrefix + ' '));
          const companyLink = document.createElement('a');
          companyLink.href = project.companyUrl;
          companyLink.target = '_blank';
          companyLink.rel = 'noreferrer';
          companyLink.textContent = project.company;
          company.append(companyLink);

          card.append(title, description, company);
          return card;
        }));
      }

      function render(lang) {
        const content = translations[lang];
        if (!content) return;

        document.documentElement.lang = lang;
        document.title = content.name + ' | ' + content.heroTitle;

        elements.navServices.textContent = content.navServices;
        elements.navProjects.textContent = content.navProjects;
        elements.navTechnology.textContent = content.navTechnology;
        elements.navAbout.textContent = content.navAbout;
        elements.navContact.textContent = content.navContact;
        elements.headerContact.textContent = content.navContact;
        elements.heroEyebrow.textContent = content.heroEyebrow;
        elements.heroTitle.textContent = content.heroTitle;
        elements.heroText.textContent = content.heroText;
        elements.heroPrimaryCta.firstElementChild.textContent = content.heroPrimaryCta;
        elements.heroSecondaryCta.textContent = content.heroSecondaryCta;
        elements.servicesTitle.textContent = content.servicesTitle;
        content.services.forEach((service, index) => {
          elements.serviceTitles[index].textContent = service.title;
          elements.serviceDescriptions[index].textContent = service.description;
        });
        elements.projectsTitle.textContent = content.projectsTitle;
        elements.projectsIntro.textContent = content.projectsIntro;
        renderProjects(content.projects, content.projectCompanyPrefix);
        elements.aboutEyebrow.textContent = content.aboutEyebrow;
        elements.aboutTitle.textContent = content.aboutTitle;
        elements.aboutText.textContent = content.aboutText;
        elements.aboutLink.textContent = content.aboutLink;
        elements.technologiesTitle.textContent = content.technologiesTitle;
        elements.technologyList.replaceChildren(...content.technologies.map((technology) => {
          const item = document.createElement('li');
          item.textContent = technology;
          return item;
        }));
        elements.contactCtaTitle.textContent = content.contactCtaTitle;
        elements.contactCtaLink.firstElementChild.textContent = content.contactCtaLabel;
        elements.copyright.textContent = '© ' + new Date().getFullYear() + ' ' + content.copyrightText;
        languageSelect.value = lang;
      }

      function detectBrowserLanguage() {
        const browserLanguage =
          (navigator.languages && navigator.languages[0]) ||
          navigator.language ||
          navigator.userLanguage ||
          'en';

        const normalized = browserLanguage.toLowerCase();
        return Object.keys(translations).find((lang) => normalized.startsWith(lang)) || 'en';
      }

      const savedLanguage = localStorage.getItem('kde-language');
      const initialLanguage = translations[savedLanguage] ? savedLanguage : detectBrowserLanguage();
      render(initialLanguage);

      languageSelect.addEventListener('change', (event) => {
        const selectedLanguage = event.target.value;
        localStorage.setItem('kde-language', selectedLanguage);
        render(selectedLanguage);
      });
    </script>
