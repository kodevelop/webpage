<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jens Malfait | Freelance Full Stack Developer</title>
    <link rel="icon" type="image/png" href="./static/kodevelop-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --kodevelop-navy: #002e6f;
        --deep-navy: #001f4d;
        --off-white: #f7f9fc;
        --white: #ffffff;
        --cool-grey: #64748b;
        --light-grey: #e8edf3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: var(--off-white);
        color: var(--deep-navy);
        line-height: 1.6;
        margin: 0;
        padding: 0;
      }

      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background-color: var(--white);
        border-bottom: 1px solid var(--light-grey);
        padding: 12px clamp(16px, 4vw, 32px);
      }

      .brand {
        display: block;
        flex: 0 1 auto;
        min-width: 0;
      }

      .brand img {
        display: block;
        width: min(250px, 42vw);
        height: auto;
      }

      .container {
        max-width: 920px;
        margin: 0 auto;
        padding: 24px clamp(16px, 4vw, 32px) 56px;
      }

      .language-menu {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .language-menu label {
        display: inline-flex;
        align-items: center;
        color: var(--cool-grey);
        font-size: 0.9rem;
      }

      .language-menu select {
        border: 1px solid var(--light-grey);
        background: var(--white);
        color: var(--deep-navy);
        border-radius: 6px;
        padding: 6px 10px;
        font: inherit;
        font-size: 0.875rem;
      }

      .language-menu select:focus-visible {
        outline: 2px solid var(--kodevelop-navy);
        outline-offset: 2px;
      }

      .profile-header {
        text-align: center;
        padding: 32px 0 24px;
      }

      .profile-header img {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        object-fit: cover;
      }

      .profile-header h1 {
        margin: 16px 0 8px;
        color: var(--kodevelop-navy);
        font-size: clamp(2.5rem, 5vw, 3.5rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.2;
      }

      .profile-header p {
        max-width: 680px;
        margin: 0 auto;
        color: var(--cool-grey);
        font-size: 1.0625rem;
        font-weight: 300;
      }

      .section {
        margin-top: 24px;
        padding: clamp(20px, 3vw, 32px);
        background-color: var(--white);
        border: 1px solid var(--light-grey);
        border-radius: 8px;
      }

      .section h2 {
        margin: 0 0 12px;
        color: var(--kodevelop-navy);
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        font-weight: 600;
        line-height: 1.25;
      }

      .section p {
        margin: 10px 0;
        color: var(--cool-grey);
      }

      .section a {
        text-decoration: none;
      }

      .section a:hover {
        text-decoration: underline;
      }

      .social-logo {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        vertical-align: middle;
        margin: 4px 8px 0 0;
      }

      .work-experience {
        list-style: none;
        padding: 0;
      }

      .work-experience li {
        margin-bottom: 12px;
        padding-left: 16px;
        position: relative;
        color: var(--cool-grey);
      }

      .work-experience li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 4px;
        bottom: 4px;
        width: 3px;
        background-color: var(--kodevelop-navy);
        border-radius: 2px;
      }

      .project-list {
        list-style: none;
        padding: 0;
        margin: 18px 0 0;
      }

      .project-list li {
        background: var(--off-white);
        border-left: 3px solid var(--kodevelop-navy);
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 12px;
        color: var(--cool-grey);
      }

      .project-list strong {
        color: var(--deep-navy);
      }

      .project-list a.project-link,
      .project-list a.company-link {
        color: var(--kodevelop-navy);
        text-decoration: none;
        font-weight: 600;
      }

      .project-list a.project-link:hover,
      .project-list a.company-link:hover {
        text-decoration: underline;
      }

      .site-footer {
        display: flex;
        justify-content: center;
        padding: 20px 16px;
        background-color: var(--deep-navy);
      }

      .site-footer img {
        display: block;
        width: min(210px, 65vw);
        height: auto;
      }

      @media (max-width: 380px) {
        .language-menu label {
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
          border: 0;
        }

        .brand img {
          width: min(220px, 48vw);
        }
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <a class="brand" href="./index.html">
        <img src="./static/kodevelop-logo-horizontal.png" alt="Kodevelop — software & architecture" />
      </a>
      <div class="language-menu">
        <label for="language-select">Language</label>
        <select id="language-select" aria-label="Select language">
          <option value="en">English</option>
          <option value="nl">Nederlands</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
    </div>
    <div class="container">
      <header class="profile-header">
        <img src="./static/headshot.png" alt="Portrait of Jens Malfait" />
        <h1 id="profile-name"></h1>
        <p id="profile-headline"></p>
      </header>

      <div class="section">
        <h2 id="profile-title"></h2>
        <p id="profile-text"></p>
      </div>

      <div class="section">
        <h2 id="expertise-title"></h2>
        <p id="expertise-intro"></p>
        <ul class="work-experience" id="expertise-list"></ul>
      </div>

      <div class="section">
        <h2 id="projects-title"></h2>
        <p id="projects-intro"></p>
        <ul class="project-list" id="projects-list"></ul>
      </div>

      <div class="section">
        <h2 id="contact-title"></h2>
        <p><strong id="role-label"></strong> <span id="role-value"></span></p>
        <p><strong id="education-label"></strong> <span id="education-value"></span></p>
        <p><strong id="location-label"></strong> <span id="location-value"></span></p>
        <p id="contact-message"></p>
        <p>
          <a href="https://www.linkedin.com/in/jens-malfait-55916a64" target="_blank" rel="noreferrer">
            <svg viewBox="0 0 48 48" alt="LinkedIn Logo" class="social-logo">
              <circle cx="24" cy="24" r="20" fill="#0077B5" />
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M18.7747 14.2839C18.7747 15.529 17.8267 16.5366 16.3442 16.5366C14.9194 16.5366 13.9713 15.529 14.0007 14.2839C13.9713 12.9783 14.9193 12 16.3726 12C17.8267 12 18.7463 12.9783 18.7747 14.2839ZM14.1199 32.8191V18.3162H18.6271V32.8181H14.1199V32.8191Z"
                fill="white"
              />
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M22.2393 22.9446C22.2393 21.1357 22.1797 19.5935 22.1201 18.3182H26.0351L26.2432 20.305H26.3322C26.9254 19.3854 28.4079 17.9927 30.8101 17.9927C33.7752 17.9927 35.9995 19.9502 35.9995 24.219V32.821H31.4922V24.7838C31.4922 22.9144 30.8404 21.6399 29.2093 21.6399C27.9633 21.6399 27.2224 22.4999 26.9263 23.3297C26.8071 23.6268 26.7484 24.0412 26.7484 24.4574V32.821H22.2411V22.9446H22.2393Z"
                fill="white"
              />
            </svg>
          </a>
          <a href="https://github.com/kodevelop" target="_blank" rel="noreferrer">
            <svg viewBox="-2 -2 24 24" alt="Github Logo" class="social-logo">
              <path
                d="M8.18 15.008c.12 0 .211-.004.271-.012a.317.317 0 0 0 .18-.107c.06-.063.09-.154.09-.274l-.004-.557c-.003-.355-.004-.637-.004-.844l-.188.033a2.41 2.41 0 0 1-.455.028 3.498 3.498 0 0 1-.57-.057 1.276 1.276 0 0 1-.548-.246 1.04 1.04 0 0 1-.36-.503l-.082-.189a2.046 2.046 0 0 0-.258-.417.989.989 0 0 0-.357-.312l-.057-.04a.602.602 0 0 1-.106-.1.455.455 0 0 1-.074-.114c-.016-.038-.003-.07.04-.094a.533.533 0 0 1 .238-.037l.164.025c.11.021.245.087.406.196.16.11.293.251.397.426.126.224.277.395.455.512a.964.964 0 0 0 .536.176c.18 0 .336-.013.467-.04a1.63 1.63 0 0 0 .369-.124c.049-.365.182-.647.4-.843a5.61 5.61 0 0 1-.839-.148 3.346 3.346 0 0 1-.77-.32 2.204 2.204 0 0 1-.66-.548c-.174-.219-.317-.505-.43-.86a4.09 4.09 0 0 1-.167-1.229c0-.66.216-1.223.647-1.687-.202-.497-.183-1.054.057-1.671.159-.05.394-.013.705.11.311.123.54.228.684.316.145.087.26.16.348.22a5.814 5.814 0 0 1 1.573-.212c.54 0 1.065.07 1.573.213l.31-.197c.214-.13.465-.251.754-.36.29-.11.511-.14.664-.09.246.617.268 1.174.065 1.67.432.465.648 1.027.648 1.688 0 .464-.056.875-.168 1.233-.112.358-.257.644-.434.86a2.29 2.29 0 0 1-.664.545 3.342 3.342 0 0 1-.77.32 5.605 5.605 0 0 1-.84.147c.284.245.426.633.426 1.163v1.957c0 .093.014.168.041.226a.226.226 0 0 0 .131.119c.06.021.114.035.16.04.047.006.113.009.2.009h-1.966-2.227z"
              />
              <path
                d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16zm0 2C4.477 20 0 15.523 0 10S4.477 0 10 0s10 4.477 10 10-4.477 10-10 10z"
              />
            </svg>
          </a>
        </p>
      </div>
    </div>
    <footer class="site-footer">
      <img src="./static/kodevelop-logo-horizontal-reversed.png" alt="Kodevelop — software & architecture" />
    </footer>

    <script>
      const translations = __SITE_CONTENT__;

      const elements = {
        name: document.getElementById('profile-name'),
        headline: document.getElementById('profile-headline'),
        profileTitle: document.getElementById('profile-title'),
        profileText: document.getElementById('profile-text'),
        expertiseTitle: document.getElementById('expertise-title'),
        expertiseIntro: document.getElementById('expertise-intro'),
        expertiseList: document.getElementById('expertise-list'),
        projectsTitle: document.getElementById('projects-title'),
        projectsIntro: document.getElementById('projects-intro'),
        projectsList: document.getElementById('projects-list'),
        contactTitle: document.getElementById('contact-title'),
        roleLabel: document.getElementById('role-label'),
        roleValue: document.getElementById('role-value'),
        educationLabel: document.getElementById('education-label'),
        educationValue: document.getElementById('education-value'),
        locationLabel: document.getElementById('location-label'),
        locationValue: document.getElementById('location-value'),
        contactMessage: document.getElementById('contact-message')
      };

      const languageSelect = document.getElementById('language-select');

      function createLink(text, url, className) {
        const link = document.createElement('a');
        link.className = className;
        link.href = url;
        link.target = '_blank';
        link.rel = 'noreferrer';
        link.textContent = text;
        return link;
      }

      function renderExpertise(items, labelSuffix) {
        elements.expertiseList.replaceChildren(...items.map((item) => {
          const listItem = document.createElement('li');
          const label = document.createElement('strong');
          label.textContent = item.label + labelSuffix;
          listItem.append(label, document.createTextNode(' ' + item.description));
          return listItem;
        }));
      }

      function renderProjects(projects, companyPrefix) {
        elements.projectsList.replaceChildren(...projects.map((project) => {
          const listItem = document.createElement('li');
          listItem.append(
            createLink(project.title, project.url, 'project-link'),
            document.createTextNode(' — ' + project.description + ' ' + companyPrefix + ' '),
            createLink(project.company, project.companyUrl, 'company-link'),
            document.createTextNode('.')
          );
          return listItem;
        }));
      }

      function render(lang) {
        const content = translations[lang];
        if (!content) return;

        document.documentElement.lang = lang;
        document.title = content.name + ' | ' + content.headline.split('·')[0].trim();

        elements.name.textContent = content.name;
        elements.headline.textContent = content.headline;
        elements.profileTitle.textContent = content.profileTitle;
        elements.profileText.textContent = content.profileText;
        elements.expertiseTitle.textContent = content.expertiseTitle;
        elements.expertiseIntro.textContent = content.expertiseIntro;
        renderExpertise(content.expertise, content.expertiseLabelSuffix);
        elements.projectsTitle.textContent = content.projectsTitle;
        elements.projectsIntro.textContent = content.projectsIntro;
        renderProjects(content.projects, content.projectCompanyPrefix);
        elements.contactTitle.textContent = content.contactTitle;
        elements.roleLabel.textContent = content.roleLabel;
        elements.roleValue.textContent = content.roleValue;
        elements.educationLabel.textContent = content.educationLabel;
        elements.educationValue.textContent = content.educationValue;
        elements.locationLabel.textContent = content.locationLabel;
        elements.locationValue.textContent = content.locationValue;
        elements.contactMessage.textContent = content.contactMessage;
        languageSelect.value = lang;
      }

      function detectBrowserLanguage() {
        const browserLanguage =
          (navigator.languages && navigator.languages[0]) ||
          navigator.language ||
          navigator.userLanguage ||
          'en';

        const normalized = browserLanguage.toLowerCase();
        return Object.keys(translations).find((lang) => normalized.startsWith(lang)) || 'en';
      }

      const savedLanguage = localStorage.getItem('kde-language');
      const initialLanguage = translations[savedLanguage] ? savedLanguage : detectBrowserLanguage();
      render(initialLanguage);

      languageSelect.addEventListener('change', (event) => {
        const selectedLanguage = event.target.value;
        localStorage.setItem('kde-language', selectedLanguage);
        render(selectedLanguage);
      });
    </script>
  </body>
</html>
