  - label: Back-End ontwikkeling
    description: ASP.NET, .NET Core, Entity Framework Core, REST API's en veilige applicatie-architectuur.
  - label: Front-End ontwikkeling
    description: Angular, TypeScript en JavaScript voor responsieve, gebruiksvriendelijke interfaces.
  - label: Software-architectuur
    description: Ontwerpen van modulaire, schaalbare oplossingen die duurzame onderhoudbaarheid ondersteunen.
  - label: Databasebeheer
