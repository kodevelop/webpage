name: Jens Malfait
headline: Freelance Full Stack Developer · Software Architect · DevOps Engineer
profileTitle: Professioneel profiel
profileText: >-
  Ik ben een freelance softwareontwikkelaar uit Izegem, België, met meer dan
  12 jaar ervaring in het bouwen van betrouwbare digitale producten voor een
  breed scala aan bedrijfsbehoeften. Ik werk aan full-stack ontwikkeling,
  back-end systemen, databases, architectuur en automatisering om teams te
  helpen applicaties veilig en schaalbaar op te bouwen.
