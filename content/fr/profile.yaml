  Mon travail associe ingénierie concrète, conception évolutive et mise en
  œuvre maintenable :
expertiseLabelSuffix: " :"
expertise:
  - label: Développement back-end
    description: ASP.NET, .NET Core, Entity Framework Core, API REST et architecture applicative sécurisée.
  - label: Développement front-end
    description: Angular, TypeScript et JavaScript pour des interfaces réactives et centrées sur l'utilisateur.
  - label: Architecture logicielle
    description: Conception de solutions modulaires et évolutives, pensées pour une maintenance durable.
  - label: Gestion de bases de données
    description: SQL Server, MySQL et Progress 4GL pour des applications solides et orientées données.
  - label: DevOps & automatisation
    description: Expérience avec GitLab CI/CD, pipelines automatisés et processus de mise en production rationalisés.
  - label: Conteneurisation
    description: Flux de travail basés sur Docker pour des déploiements cohérents et des environnements évolutifs.
  - label: Documentation
    description: Rédaction de documentation technique claire et de guides système pour les équipes et les parties prenantes.
