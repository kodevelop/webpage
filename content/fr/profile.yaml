name: Jens Malfait
headline: Développeur Full Stack Freelance · Architecte Logiciel · DevOps
profileTitle: Profil professionnel
profileText: >-
  Je suis un développeur logiciel freelance basé à Izegem, en Belgique, avec
  plus de 12 ans d'expérience dans la création de produits numériques fiables
  pour un large éventail de besoins professionnels. Je travaille sur le
  développement full stack, les systèmes backend, les bases de données,
  l'architecture et l'automatisation afin d'aider les équipes à concevoir des
  applications robustes et évolutives.
