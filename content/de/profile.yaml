expertise:
  - label: Back-End-Entwicklung
    description: ASP.NET, .NET Core, Entity Framework Core, REST-APIs und sichere Anwendungsarchitektur.
  - label: Front-End-Entwicklung
    description: Angular, TypeScript und JavaScript für responsive, nutzerorientierte Oberflächen.
  - label: Softwarearchitektur
    description: Entwurf modularer, skalierbarer Lösungen mit Fokus auf langfristige Wartbarkeit.
  - label: Datenbankmanagement
    description: SQL Server, MySQL und Progress 4GL für robuste, datengetriebene Anwendungen.
  - label: DevOps & Automatisierung
    description: Erfahrung mit GitLab CI/CD, automatisierten Pipelines und optimierten Release-Prozessen.
  - label: Containerisierung
    description: Docker-basierte Workflows für konsistente Bereitstellungen und skalierbare Umgebungen.
  - label: Dokumentation
    description: Erstellung klarer technischer Dokumentation und Systemanleitungen für Teams und Stakeholder.
