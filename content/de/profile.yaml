name: Jens Malfait
headline: Freiberuflicher Full-Stack-Entwickler · Softwarearchitekt · DevOps Engineer
profileTitle: Berufsprofil
profileText: >-
  Ich bin ein freiberuflicher Softwareentwickler aus Izegem, Belgien, mit über
  12 Jahren Erfahrung in der Entwicklung zuverlässiger digitaler Produkte für
  ein breites Spektrum an Geschäftsanforderungen. Ich arbeite an
  Full-Stack-Entwicklung, Backend-Systemen, Datenbanken, Architektur und
  Automatisierung, um Teams dabei zu unterstützen, Anwendungen sicher und
  skalierbar aufzubauen.
expertiseTitle: Kernkompetenzen
